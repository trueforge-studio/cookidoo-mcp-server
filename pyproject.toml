[project]
name = "cookidoo-mcp-server"
version = "1.0.1"
description = "MCP server for Cookidoo recipes, shopping lists, collections, and meal planning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "Joaquin Nunez", email = "joaquin@ayhungry.com" },
]
keywords = ["mcp", "cookidoo", "thermomix", "recipes", "meal-planning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "mcp==1.0.0",
  "cookidoo-api==0.17.2",
  "aiohttp>=3.9.0",
]

[project.urls]
Homepage = "https://trueforge.studio"
Repository = "https://github.com/trueforge-studio/cookidoo-mcp-server"

[project.scripts]
cookidoo-mcp-server = "mcp_server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["mcp_server.py"]
