services:
  cookidoo-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: ["python", "mcp_server.py"]
    env_file:
      - path: .env.mcp
        required: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    restart: "no"